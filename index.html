@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

["Silva, M. G., & Tolfo, S. R. (2026).","Fatores de risco psicossociais, impactos na saúde mental e mapeamento de práticas interventivas no trabalho de profissionais assistenciais em unidades hospitalares: revisão de escopo. Revista Brasileira de Saúde Ocupacional, 51, e17.","https://www.scielo.br/j/rbso/a/vtDqZtSx9VWxW3SNN95yRGM/?format=html&ilang=pt_BR"],
["Ministério da Saúde.","Transtorno Mental Relacionado ao Trabalho.","https://www.gov.br/saude/pt-br/composicao/svsa/saude-do-trabalhador/vigilancia-em-saude-do-trabalhador-vigisat/doencas-e-agravos-relacionados-ao-trabalho/transtorno-mental-relacionado-ao-trabalho"]];
const ST=["Reconhecer","Contextualizar","Identificar necessidades","Refletir","Devolutiva"];

// Estado apenas em memória: nada é salvo nem enviado.
let S={view:"home",step:0,em:[],cx:[],nd:null,open:-1};
const $=s=>document.querySelector(s),app=$("#app");
const head=i=>`<p class="top"><b>CASA VIVA UFC</b></p><div class="seg" role="progressbar" aria-valuemin="1" aria-valuemax="5" aria-valuenow="${i+1}">${ST.map((_,k)=>`<span class="${k<i?"c":k==i?"d":""}"><i></i></span>`).join("")}</div><p class="stl">Etapa ${i+1} de 5 · ${ST[i]}</p>`;
const foot=(ok,last)=>`<div class="foot"><button class="btn s" data-a="back">Voltar</button>${last?"":`<button class="btn p" data-a="next" ${ok?"":"disabled"}>Continuar</button>`}</div>`;
const em1=()=>E.find(e=>e[0]==S.em[0]),em2=()=>E.find(e=>e[0]==S.em[1]);
const msg=()=>{const e=em1(),e2=em2(),cx=S.cx.slice(0,2).map(c=>X.find(x=>x[0]==c)[2]),nd=N.find(n=>n[0]==S.nd);
 return[e[5],e2?`Também apareceu ${e2[3]}, e sentir mais de uma coisa ao mesmo tempo é comum.`:"",...cx,nd?nd[3]:""].filter(Boolean).join(" ")};
const V={
home:()=>`<p class="top"><b>CASA VIVA UFC</b><br>Ação do Programa Qualidade de Vida no Trabalho / USOST / DivGP.</p>
<div class="hero"><div class="blob" style="width:70px;height:70px;background:var(--y);opacity:.55;left:4%;top:20px"></div><div class="blob" style="width:44px;height:44px;background:var(--g);opacity:.6;right:6%;top:6px;animation-delay:-3s"></div><div class="blob" style="width:30px;height:30px;background:var(--b);opacity:.5;right:12%;top:150px;animation-delay:-5s"></div>
<div class="enter fl" style="position:relative">${av(C.wel,230)}</div></div>
<h1>Olhar sobre as Emoções</h1><p class="quote">“Que espaço seus sentimentos estão ocupando hoje?”</p>
<p class="sub">Na rotina, nem sempre conseguimos parar para perceber o que sentimos. Este é um convite para olhar para si com mais atenção, compreender o que pode estar acontecendo e descobrir possibilidades de cuidado.</p>
<div class="trio"><div><i style="background:var(--l)"></i><b>RECONHECER</b>perceber o que estou sentindo</div><div><i style="background:#fbe3a6"></i><b>COMPREENDER</b>explorar o que pode estar relacionado</div><div><i style="background:#bfeae2"></i><b>CUIDAR</b>identificar cuidado e apoio</div></div>
<button class="btn y" data-a="start">Começar minha experiência</button>
<p class="hint">Esta experiência é educativa e reflexiva. Não substitui acompanhamento profissional.</p>`,
exp:()=>{const s=S.step;
 if(s==0)return head(0)+`<h2>Como você está se sentindo neste momento?</h2><p class="sub">Não existe resposta certa ou errada. Escolha a emoção que mais se aproxima do que você está sentindo agora. Se for difícil identificar, tudo bem.</p><div class="grid">${E.map(e=>`<button class="em ${S.em[0]==e[0]?"on":S.em[1]==e[0]?"on2":""}" data-a="em" data-i="${e[0]}" aria-pressed="${S.em.includes(e[0])}">${av(C[e[0]],84)}<b>${e[1]}</b><small>${e[2]}</small></button>`).join("")}</div><p class="hint">Se quiser, toque em uma segunda emoção para marcá-la como secundária (opcional).</p>`+foot(S.em.length)
 if(s==1)return head(1)+`<h2>O que pode estar relacionado ao que você sente?</h2><p class="sub">Às vezes, uma emoção está ligada a uma situação específica. Em outras, pode envolver várias coisas ao mesmo tempo. Você pode escolher mais de uma opção e não precisa contar detalhes.</p>${X.map(x=>`<button class="opt ${S.cx.includes(x[0])?"on":""}" data-a="cx" data-i="${x[0]}" aria-pressed="${S.cx.includes(x[0])}"><i>${S.cx.includes(x[0])?"✓":""}</i>${x[1]}</button>`).join("")}`+foot(S.cx.length)
 if(s==2)return head(2)+`<h2>Do que você precisa neste momento?</h2><p class="sub">Escolha a opção que mais faz sentido agora.</p>${N.map(n=>`<button class="em need ${S.nd==n[0]?"on":""}" style="width:100%;margin:8px 0;flex-direction:row" data-a="nd" data-i="${n[0]}">${av(C[n[0]],78)}<div><b>${n[1]}</b><small>${n[2]}</small></div></button>`).join("")}`+foot(S.nd)
 if(s==3)return head(3)+`<div style="text-align:center" class="fl">${av(C.ref,150)}</div><h2>Vamos olhar para isso com um pouco mais de atenção?</h2><div class="q">${em1()[4]}</div><p class="sub">Se quiser, escreva abaixo. É opcional: o texto serve só para a sua reflexão agora, não é guardado nem enviado.</p><textarea aria-label="Reflexão opcional (não é guardada)"></textarea>`+foot(true)
 return head(4)+`<h2>Um passo de cada vez.</h2><div class="card"><p>${msg()}</p>${S.nd=="pau"?`<div class="breathe" aria-hidden="true"></div><p class="hint">Acompanhe o círculo: inspire enquanto ele cresce, expire enquanto ele diminui.</p>`:""}</div>
<div class="card esc"><div class="enter">${scene()}</div><h2>Você não precisa lidar com tudo sozinho.</h2><h3>Programa Acolhe — USOST</h3>
<p>Reconhecer o que você sente é um passo importante. E, se precisar conversar, organizar seus pensamentos ou compartilhar algo que esteja vivendo, você pode buscar um espaço de escuta e acolhimento.</p><p>O Programa Acolhe, ligado à USOST, oferece acolhimento psicológico e escuta qualificada a trabalhadores da saúde. Se sentir que esse espaço pode ser importante para você, entre em contato pelo WhatsApp do programa.</p>
<button class="btn y" data-a="book">FALAR COM O ACOLHE NO WHATSAPP</button><p class="hint" style="margin:0 0 6px">Buscar apoio também é uma forma de cuidado.</p><button class="btn s" data-a="go" data-v="usost">Conhecer o programa</button></div>
<button class="btn p" data-a="again">Explorar outra emoção</button><button class="btn s" data-a="home">Voltar ao início</button>`+foot(true,true).replace(/.*/s,"")},
learn:()=>`<p class="top"><b>CASA VIVA UFC</b></p><h2>Entenda suas emoções</h2><p class="sub">Toque em um cartão para ler mais.</p>${L.map((l,i)=>`<button class="acc ${S.open==i?"on":""}" data-a="acc" data-i="${i}" aria-expanded="${S.open==i}"><h3>${l[0]}</h3><div><p>${l[1]}</p></div></button>`).join("")}`,
sci:()=>`<p class="top"><b>CASA VIVA UFC</b></p><h2>Ciência por trás do cuidado</h2><p class="sub">Referências que inspiram este aplicativo.</p>${R.map(r=>`<div class="card ref"><p><b>${r[0]}</b> ${r[1]}</p><p style="margin-top:8px"><a href="${r[2]}" target="_blank" rel="noopener noreferrer">${r[2]}</a></p></div>`).join("")}`,
usost:()=>`<p class="top"><b>CASA VIVA UFC</b></p><div class="card esc"><div class="enter">${scene()}</div><h2>Programa Acolhe — USOST</h2><p>O Programa Acolhe, ligado à Unidade de Saúde Ocupacional e Segurança do Trabalho (USOST), é uma iniciativa de acolhimento psicológico, escuta qualificada e suporte em saúde mental para trabalhadores da saúde. A busca é voluntária e você decide se e quando fazer isso.</p><p>O contato é feito pelo WhatsApp do programa: <b>+55 85 9106-2542</b>.</p><p class="hint" style="text-align:left">Em situação de emergência, procure o serviço de urgência mais próximo.</p><button class="btn y" data-a="book">FALAR COM O ACOLHE NO WHATSAPP</button><p class="hint" style="margin:0">Buscar apoio também é uma forma de cuidado.</p></div><button class="btn s" data-a="home">Voltar ao início</button>`};
const NV=[["home","Início","M3 11l9-8 9 8v10H3z"],["exp","Experiência","M12 21s-8-5-8-11a4.5 4.5 0 018-3 4.5 4.5 0 018 3c0 6-8 11-8 11z"],["learn","Entenda","M4 5h7a2 2 0 012 2v13a2 2 0 00-2-2H4zM20 5h-7"],["sci","Ciência","M9 3h6M10 3v6l-5 9a2 2 0 002 3h10a2 2 0 002-3l-5-9V3"],["usost","Acolhe","M4 5h16v11H9l-5 4z"]];
function render(anim=true){const y=scrollY;app.className="";app.innerHTML=V[S.view]();if(anim){void app.offsetWidth;app.className="in";scrollTo(0,0)}else scrollTo(0,y);
 $("#nav").innerHTML=NV.map(n=>`<button class="${S.view==n[0]?"on":""}" data-a="go" data-v="${n[0]}" ${S.view==n[0]?'aria-current="page"':""}><svg viewBox="0 0 24 24"><path d="${n[2]}"/></svg>${n[1]}</button>`).join("")}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("s");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("s"),3200)}
document.addEventListener("click",ev=>{const t=ev.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,i=t.dataset.i;let anim=true;
 if(a=="go")S.view=t.dataset.v;
 else if(a=="start"){S.view="exp";S.step=0}
 else if(a=="next"){S.step=Math.min(4,S.step+1)}
 else if(a=="back"){if(S.step==0)S.view="home";else S.step--}
 else if(a=="em"){anim=false;const k=S.em.indexOf(i);if(k>=0)S.em.splice(k,1);else if(S.em.length<2)S.em.push(i);else S.em[1]=i}
 else if(a=="cx"){anim=false;const k=S.cx.indexOf(i),ex=["nsei","nr"];if(k>=0)S.cx.splice(k,1);else if(ex.includes(i))S.cx=[i];else S.cx=S.cx.filter(c=>!ex.includes(c)).concat(i)}
 else if(a=="nd"){anim=false;S.nd=i}
 else if(a=="acc"){anim=false;S.open=S.open==+i?-1:+i}
 else if(a=="again"){S={...S,view:"exp",step:0,em:[],cx:[],nd:null}}
 else if(a=="home"){S={...S,view:"home",step:0,em:[],cx:[],nd:null}}
 else if(a=="book"){toast("Abrindo o WhatsApp. Se não abrir, use o número +55 85 9106-2542.");window.open(LINK_WHATSAPP_ACOLHE,"_blank","noopener");return}
 render(anim)});
render();
</script></body></html>
